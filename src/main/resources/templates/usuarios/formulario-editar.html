<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar usuario')}"></head>
<body>

<header th:replace="~{fragments/layout :: encabezado}"></header>

<main class="contenedor">

    <div class="encabezado-seccion">
        <div>
            <h1>Editar usuario</h1>
            <p class="subtitulo">Usuario <strong th:text="${'#' + usuario.id}">#1</strong></p>
        </div>
        <a class="boton boton-secundario" th:href="@{/usuarios}">← Volver a usuarios</a>
    </div>

    <form class="tarjeta" method="post" th:action="@{/usuarios/actualizar/{id}(id=${usuario.id})}">

        <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" th:value="${usuario.nombre}" maxlength="100"
                   required="required"/>
        </div>

        <div class="fila-campos">
            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" th:value="${usuario.email}" maxlength="100"
                       required="required"/>
                <span class="ayuda">Debe ser único en el sistema.</span>
            </div>

            <div class="campo">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required="required">
                    <option th:each="r : ${roles}"
                            th:value="${r}"
                            th:text="${r}"
                            th:selected="${usuario.rol != null and r.name() == usuario.rol.name()}">CLIENTE</option>
                </select>
            </div>
        </div>

        <div class="formulario-acciones">
            <button class="boton" type="submit">Guardar cambios</button>
            <a class="boton boton-secundario" th:href="@{/usuarios}">Cancelar</a>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
