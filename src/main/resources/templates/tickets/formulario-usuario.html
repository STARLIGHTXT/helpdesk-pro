<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo usuario')}"></head>
<body>

<header th:replace="~{fragments/layout :: encabezado}"></header>

<main class="contenedor">

    <div class="encabezado-seccion">
        <div>
            <h1>Registrar usuario</h1>
            <p class="subtitulo">Alta de clientes y técnicos del sistema.</p>
        </div>
        <a class="boton boton-secundario" th:href="@{/usuarios}">← Volver a usuarios</a>
    </div>

    <form class="tarjeta" method="post" th:action="@{/usuarios/guardar}" th:object="${usuario}">

        <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" th:field="*{nombre}" maxlength="100"
                   placeholder="Ej. Carlos Xolalpa" required="required"/>
        </div>

        <div class="fila-campos">
            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{email}" maxlength="100"
                       placeholder="correo@ejemplo.com" required="required"/>
                <span class="ayuda">Debe ser único en el sistema.</span>
            </div>

            <div class="campo">
                <label for="rol">Rol</label>
                <select id="rol" th:field="*{rol}" required="required">
                    <option th:each="r : ${roles}"
                            th:value="${r}"
                            th:text="${r}">CLIENTE</option>
                </select>
            </div>
        </div>

        <div class="formulario-acciones">
            <button class="boton" type="submit">Guardar usuario</button>
            <a class="boton boton-secundario" th:href="@{/helpdesk}">Cancelar</a>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
