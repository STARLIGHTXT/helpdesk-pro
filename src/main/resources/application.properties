spring.application.name=sistema-gestor-soporte-tecnico

# Mantener la sesión solo en cookie (evita el ;jsessionid en las URLs).
server.servlet.session.tracking-modes=cookie

# Las credenciales viven en application-secrets.properties (en src/main/resources, ignorado por git).
# Se leen del classpath, así funciona sin importar el directorio de trabajo (IntelliJ, Maven, jar).
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
# 0 = no usar sentencias preparadas del lado del servidor.
# Evita el error "cached plan must not change result type" cuando cambia el
# esquema (schema.sql) sobre una base compartida.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Los scripts schema.sql y data.sql son idempotentes: no borran información.
spring.sql.init.mode=always
